[package]
name = "binary-hyperfold"
version = "0.1.0"
edition = "2024"

[features]
default = ["parallel", "flock"]
parallel = ["p3-maybe-rayon/parallel", "p3-binary-field/parallel", "p3-binary-dft/parallel", "p3-merkle-tree/parallel"]

flock = ["dep:flock-field", "dep:flock-hash", "dep:flock-merkle", "dep:flock-multilinear", "dep:flock-parallel", "dep:flock-transcript", "dep:flock-core", "dep:flock-prover"]

[dependencies]
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-binary-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-binary-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
p3-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "0d803737b681774186cd283b1fd2d8e493655c82" }
rayon = "1.10"
blake3 = "1.5"
rand = "0.10"
rand_chacha = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
thiserror = "2"

flock-field = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }
flock-hash = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }
flock-merkle = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }
flock-multilinear = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }
flock-parallel = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }
flock-transcript = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }
flock-core = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }
flock-prover = { git = "https://github.com/succinctlabs/flock.git", rev = "dcd17533128a595e475b3dbba56c3dc2ad65161f", optional = true }

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "primitives"
harness = false

[[bin]]
name = "bench_flock"
required-features = ["flock"]
